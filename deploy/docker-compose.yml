# Gopherdex behind Caddy with automatic HTTPS.
#
#   cp gopherdex.env.example gopherdex.env   # then fill it in
#   docker compose up -d
#   docker compose logs -f gopherdex
services:
  gopherdex:
    image: ghcr.io/parthiban-sivakumar/gopherdex:latest
    build: ..
    restart: unless-stopped
    env_file: gopherdex.env
    environment:
      GOPHERDEX_TRUST_PROXY: "true" # client IPs come from Caddy's X-Forwarded-For
    volumes:
      - gopherdex-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: gopherdex.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gopherdex

  # Opt-in continuous replication of the database to S3 (see README):
  #   docker compose --profile litestream up -d
  litestream:
    image: litestream/litestream:0.3
    profiles: ["litestream"]
    restart: unless-stopped
    user: "65532:65532" # the registry image's user, so both can write the database files
    env_file: gopherdex.env
    command: replicate
    volumes:
      - gopherdex-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - gopherdex

volumes:
  gopherdex-data:
  caddy-data:
  caddy-config:
