# Asks first-time contributors to sign the CLA (CLA.md) on their pull
# request, and records signatures on the cla-signatures branch. It runs on
# pull_request_target so it can comment on pull requests from forks; it
# never checks out or runs the pull request's code.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # to store signatures on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/parthiban-sivakumar/gopherdex/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: parthiban-sivakumar,dependabot[bot]
